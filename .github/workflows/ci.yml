name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
        node:
          - 20
          - 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - run: npm run lint
      - run: npm run format
      - name: Validate Claude plugin manifest when Claude is available
        run: |
          if command -v claude >/dev/null 2>&1; then
            claude plugin validate .claude-plugin/plugin.json
          else
            echo "SKIP claude plugin validate: claude is not on PATH"
          fi
      - run: npm --cache "$RUNNER_TEMP/npm-cache" pack --dry-run
