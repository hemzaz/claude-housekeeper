name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
        node:
          - 20
          - 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - run: npm run lint
      - run: npm run format
      - run: npm --cache "$RUNNER_TEMP/npm-cache" pack --dry-run

  version-pin:
    name: docs/index.html version pin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docs/index.html version pin matches package.json
        run: |
          VERSION="$(jq -r .version package.json)"
          grep -q "v$VERSION" docs/index.html \
            || (echo "::error::docs/index.html version pin does not match package.json v$VERSION" && exit 1)
