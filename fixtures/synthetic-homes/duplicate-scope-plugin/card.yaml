id: duplicate-scope-plugin
purpose: |
  Same plugin enabled at user and project scope is reviewable, not
  automatically wrong (loader-semantics.md §1; protocol-contracts.md
  "Edge Case 7").
mode_expectations:
  safe:
    claim_level: finding
    stance: review
surfaces:
  - path: ~/.claude/plugins/installed_plugins.json
    surfaceClass: claude-managed-state
    ownerClass: claude-managed
    loadBearingClass: known-load-bearing
    sensitivityClass: private-path
    executionClass: inert
    rollbackClass: snapshot-possible
    scopeClass: in-scope
evidence:
  structural:
    - same plugin@marketplace key registered in multiple scope records
  loader:
    - documented precedence places project above user
  missing:
    - effective precedence in current session
    - user intent for second registration
finding:
  id: plugin.duplicate_registration
  class: divergence
  stance: review
allowed_next_step: review intent before any change
blocked_actions:
  - remove one scope
  - infer one registration is orphaned
  - mutate registry without intent confirmation
