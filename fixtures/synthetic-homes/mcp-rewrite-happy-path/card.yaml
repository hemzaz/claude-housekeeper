id: mcp-rewrite-happy-path
purpose: |
  MCP server config with a broken command path that is eligible for
  --mcp-command-rewrite. The existing entry command does not exist on disk,
  so settings.mcp_command_missing fires. A rewrite (not a strip) is the
  intended repair: pass --mcp-command-rewrite=<old>=<new> where <new> is
  a real executable. Used by test/mcp-rewrite.test.mjs T-203.
mode_expectations:
  safe:
    claim_level: finding
    stance: prepare
surfaces:
  - path: settings.json
    surfaceClass: authored-config
    ownerClass: user-owned
    loadBearingClass: known-load-bearing
    sensitivityClass: secret-adjacent
    executionClass: starts-mcp
    rollbackClass: snapshot-possible
    scopeClass: in-scope
evidence:
  structural:
    - settings.json parses as valid JSON
    - mcpServers.my-server.command is an absolute path that does not exist
  expected_finding:
    detectorId: settings.mcp_command_missing
    stance: prepare
  rewrite_scenario:
    brokenCommand: /usr/local/bin/ghost-mcp-server-that-does-not-exist
    description: >
      Passing --mcp-command-rewrite=<brokenCommand>=<new-executable> should
      produce a settings-rewrite op with patch
      {op: "set", path: ["mcpServers", "my-server", "command"], value: "<new>"}
      without removing the mcpServers entry or touching args.
finding:
  class: integrity
  stance: prepare
allowed_next_step: rewrite command via --mcp-command-rewrite; do not start the server
blocked_actions:
  - start the MCP server
  - remove the mcpServers entry without consent
  - claim the server is broken before live status is checked
