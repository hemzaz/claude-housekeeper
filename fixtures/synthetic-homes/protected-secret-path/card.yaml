id: protected-secret-path
purpose: Secret-adjacent paths are visible but not inspected.
mode_expectations:
  safe:
    claim_level: surface
    stance: protect
surfaces:
  - path: ~/.claude/settings.json
    surfaceClass: authored-config
  - path: ~/.env
    surfaceClass: secret-adjacent
    sensitivityClass: secret-content
    scopeClass: sector-boundary
  - path: ~/.claude/credentials
    surfaceClass: secret-adjacent
    sensitivityClass: secret-adjacent
    scopeClass: parent-contains-boundary
finding:
  class: orientation
  stance: protect
allowed_next_step: none
blocked_actions:
  - read secret file
  - print secret value
  - propose cleanup
report_expectations:
  - PRIMARY stance is protect
  - BOUNDARIES counts include parent-side sector-boundary at ~/.env and child-side parent-contains-boundary at ~/.claude/credentials
  - PROTECTED section lists the do-not-touch rule that matched
  - No secret file content appears in the rendered report
